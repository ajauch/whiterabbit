repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.0, httpx>=0.27, typer>=0.12, rich>=13.0, jinja2>=3.1, sslyze>=6.0]
        args: [--strict, src/]
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest tests/ -v -m "not integration" --tb=short -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
